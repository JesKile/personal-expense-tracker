<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Expense Tracker</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="app-header">
    <div class="header-inner">
      <span class="logo">💰</span>
      <h1>Personal Expense Tracker</h1>
    </div>
  </header>

  <main class="container">

    <!-- ============ ADD EXPENSE FORM ============ -->
    <section class="card">
      <h2>Add an Expense</h2>
      <form id="expense-form" class="expense-form">
        <div class="form-row">
          <div class="form-group">
            <label for="amount">Amount</label>
            <input type="number" id="amount" name="amount" min="0.01" step="0.01" placeholder="e.g. 25.50" required />
          </div>

          <div class="form-group">
            <label for="category">Category</label>
            <select id="category" name="category" required>
              <option value="" disabled selected>Select category</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Shopping">Shopping</option>
              <option value="Bills">Bills</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Health">Health</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="form-group">
            <label for="date">Date</label>
            <input type="date" id="date" name="date" required />
          </div>
        </div>

        <div class="form-group">
          <label for="note">Note (optional)</label>
          <input type="text" id="note" name="note" placeholder="e.g. Groceries at the market" />
        </div>

        <button type="submit" class="btn-primary">Add Expense</button>
        <p id="form-message" class="form-message" role="alert"></p>
      </form>
    </section>

    <!-- ============ FILTERS + TOTAL ============ -->
    <section class="card">
      <h2>Your Expenses</h2>

      <div class="filters">
        <div class="form-group">
          <label for="filter-month">Filter by month</label>
          <input type="month" id="filter-month" />
        </div>

        <div class="form-group">
          <label for="filter-category">Filter by category</label>
          <select id="filter-category">
            <option value="">All categories</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Shopping">Shopping</option>
            <option value="Bills">Bills</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Health">Health</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <button id="clear-filters" class="btn-secondary">Clear Filters</button>
      </div>

      <div class="summary">
        <span>Total: <strong id="total-amount">$0.00</strong></span>
        <span><span id="expense-count">0</span> expense(s)</span>
      </div>

      <!-- Expense list is rendered here dynamically by app.js -->
      <div id="expense-list" class="expense-list">
        <p class="empty-state">No expenses yet. Add your first one above!</p>
      </div>
    </section>

  </main>

  <footer class="app-footer">
    <p>Personal Expense Tracker &mdash; Project Java and Web Development (DLBCSPJWD01)</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
